name: Java kata
on:
  push:
    branches: [java-kata]
  pull_request:
    paths: ['Java/**', '.github/workflows/java-kata.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
          cache-dependency-path: Java/pom.xml
      - run: mvn --batch-mode -f Java/pom.xml verify
